name: iOS Simulator Review

# Cloud-side review loop: build the real app for the iPhone simulator on a
# GitHub-hosted Apple Silicon runner, launch it, and publish screenshots plus a
# short screen recording. No signing, no secrets, no device.
#
# The build half lives in .github/actions/build-simulator so this workflow and
# ios-interactive.yml cannot drift apart.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-simulator-review-${{ github.ref }}
  # Never let a queued run kill the one already building: a cancelled run
  # reports no step data at all, which is indistinguishable from "still queued".
  cancel-in-progress: false

jobs:
  review:
    runs-on: macos-26
    timeout-minutes: 150
    # Needed only by the publish steps: they force-push logs and assets to
    # throwaway branches so the results can be read without a token (the REST
    # log endpoint answers 403 to unauthenticated callers).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build for the simulator
        id: buildsim
        uses: ./.github/actions/build-simulator

      - name: Boot, install, launch, capture
        id: capture
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
          APP: ${{ steps.buildsim.outputs.app_path }}
          BUNDLE: ${{ steps.buildsim.outputs.bundle_id }}
        run: |
          exec > >(tee "$RUNNER_TEMP/capture.log") 2>&1
          set -euo pipefail
          test -d "$APP"
          mkdir -p review-assets

          xcrun simctl bootstatus "$UDID" -b
          # Light appearance keeps layout review deterministic.
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl install "$UDID" "$APP"

          # First launch exists only to let the app create its schema and its
          # Library/MinisChat container. A fresh install has no database, so
          # this is the only window where the file can be written from outside.
          xcrun simctl launch "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
          sleep 15
          xcrun simctl terminate "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
          sleep 2

          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          DB="$DATA/Library/MinisChat/minis.db"
          test -f "$DB"
          ls -la "$DB"
          # Direct writes are the only option: the in-app debug RPC is
          # read-only (debug.db.query calls assertReadOnlySQL).
          sqlite3 "$DB" < .github/ci/seed-review-session.sql
          sqlite3 "$DB" "SELECT count(*) FROM sessions;"

          # Show the two new features instead of the placeholder symbols: one
          # session gets a real avatar, and SOUL.md gets an animated GIF icon.
          # Both are plain files the app already knows how to read.
          # SOUL.md does not live in the app's own container: it sits in the
          # app-group container under MinisFileProvider/memory, so the extension
          # can read it too. Ask the simulator for that container by name.
          GROUP=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" group.group.com.openminis.app || true)
          MEM="$GROUP/MinisFileProvider/memory"
          AVDIR="$DATA/Library/MinisChat/minis/seed-review-session"
          mkdir -p "$MEM" "$AVDIR"
          cp .github/ci/assets/session-avatar-demo.png "$AVDIR/session-avatar-demo0001.png"
          sqlite3 "$DB" "UPDATE sessions SET avatar_ref='session-avatar-demo0001.png' WHERE id='seed-review-session';"
          if [ -n "$GROUP" ] && [ -d "$MEM" ]; then
            cp .github/ci/assets/soul-demo.gif "$MEM/SOUL.icon.gif"
            rm -f "$MEM/SOUL.icon.png"
            python3 .github/ci/seed_soul_icon.py "$MEM/SOUL.md" "SOUL.icon.gif"
            ls -la "$MEM"
          else
            echo "::warning::app-group container not found at $MEM; the soul GIF was not seeded"
          fi
          sqlite3 "$DB" "SELECT id, avatar_ref FROM sessions ORDER BY updated_at DESC;"

          # The debug server's auth switch defaults to ON (DebugAuth.swift:58),
          # and a paired envelope cannot be produced from a shell. Flipping the
          # pref through the simulator's own defaults keeps cfprefsd coherent;
          # hand-writing the plist is overwritten on the app's next launch.
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE" debug.auth.required -bool NO \
            || echo "defaults write failed; public RPC will answer 401"

          xcrun simctl launch --console-pty "$UDID" "$BUNDLE" > review-assets/launch.log 2>&1 &
          sleep 20
          xcrun simctl io "$UDID" screenshot review-assets/01-launch.png || true

          # simctl openurl makes SpringBoard put up an "Open in Minis?"
          # confirmation and nothing here can tap it, so navigate through the
          # app's own debug RPC: debug.openSession posts the very notification
          # the deep link would, without a system dialog.
          RPC=http://127.0.0.1:8321/rpc
          curl -s -m 10 http://127.0.0.1:8321/schema > review-assets/debug-schema.txt || true
          rpc() { curl -s -m 20 -X POST "$RPC" -H 'Content-Type: application/json' -d "$1" || true; }
          rpc '{"jsonrpc":"2.0","id":1,"method":"debug.openSession","params":{"sessionId":"seed-review-session"}}' \
            > review-assets/rpc-open-session.json || true
          cat review-assets/rpc-open-session.json || true
          if ! grep -q '"ok":true' review-assets/rpc-open-session.json 2>/dev/null; then
            echo "debug.openSession did not confirm; falling back to the URL scheme"
            xcrun simctl openurl "$UDID" "minis://sessions/seed-review-session" || true
          fi
          sleep 5
          xcrun simctl io "$UDID" screenshot review-assets/02-chat.png || true

          # Scroll so the tool capsule and the markdown table are on screen too;
          # one screenshot of the top of the transcript shows neither.
          rpc '{"jsonrpc":"2.0","id":2,"method":"debug.scroll","params":{"x":196,"y":620,"deltaX":0,"deltaY":-620}}' \
            > review-assets/rpc-scroll.json || true
          sleep 3
          xcrun simctl io "$UDID" screenshot review-assets/03-chat-scrolled.png || true

          # A few seconds of motion makes animation and scroll chrome visible.
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force review-assets/launch.mp4 &
          REC=$!
          sleep 12
          kill -INT "$REC" 2>/dev/null || true
          wait "$REC" 2>/dev/null || true

          xcrun simctl io "$UDID" screenshot review-assets/04-after.png || true
          xcrun simctl spawn "$UDID" log show --last 3m \
            --predicate "process == 'Minis'" --style compact > review-assets/app.log 2>&1 || true
          ls -la review-assets

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minis-simulator-review
          path: review-assets
          if-no-files-found: warn
          retention-days: 30

      # Artifact download and the log REST endpoint both need a token. Publishing
      # to throwaway branches keeps the results readable by anyone through
      # raw.githubusercontent.com, which is the only channel this agent has.
      - name: Publish review assets
        if: always()
        run: |
          set -uo pipefail
          if [ ! -d review-assets ]; then echo "no review-assets directory"; exit 0; fi
          rm -rf "$RUNNER_TEMP/assets"; cp -r review-assets "$RUNNER_TEMP/assets"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch --depth 1 origin main || true
          git checkout -B review origin/main
          rm -rf review-assets; cp -r "$RUNNER_TEMP/assets" review-assets
          git add -f review-assets
          git commit -m "ci: review assets for run ${GITHUB_RUN_ID}" || exit 0
          git push --force origin review

      - name: Publish failure logs
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          for f in "$RUNNER_TEMP"/*.log; do
            [ -f "$f" ] || continue
            tail -c 300000 "$f" > "$RUNNER_TEMP/logs/$(basename "$f")"
          done
          ls -la "$RUNNER_TEMP/logs" || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch --depth 1 origin main || true
          git checkout -B ci-logs origin/main
          rm -rf .ci-logs; mkdir -p .ci-logs
          cp "$RUNNER_TEMP"/logs/* .ci-logs/ 2>/dev/null || true
          # The run id makes every failure produce a real change. Identical logs
          # from two runs used to make `git commit` a no-op, which silently kept
          # the branch stale and hid that nothing had advanced.
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "commit=${GITHUB_SHA}"
            echo "job_status=${{ job.status }}"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- logs ---"
            for f in .ci-logs/*; do [ -f "$f" ] && echo "$(wc -c < "$f") $(basename "$f")"; done
          } > .ci-logs/meta.txt
          cat .ci-logs/meta.txt
          git add -f .ci-logs
          git commit -m "ci: failure logs for run ${GITHUB_RUN_ID}" || exit 0
          git push --force origin ci-logs
