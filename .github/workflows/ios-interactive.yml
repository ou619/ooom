name: iOS Simulator Interactive

# Why this exists: the owner has no Mac. Screenshots can show a layout, but only
# a live session lets him click, type and drag the real app. This job builds the
# simulator app, exposes the app's own debug RPC through a Cloudflare quick
# tunnel, and publishes the tunnel URL to a branch so it can be read without a
# GitHub token. When the job ends the tunnel and the app die with it.
#
# How to start one: push any commit to the `remote` branch (or run this workflow
# manually). Read the URL at
#   https://raw.githubusercontent.com/ou619/ooom/remote-url/.remote/url.txt
# Then open it in a browser: the page is a phone frame that polls screenshots
# and turns your clicks into debug.tap / debug.scroll / debug.inputText.
#
# Setup is deliberately split into many small steps: a single fat script hides
# which command blocked when a `simctl` call stalls, and the job view only names
# the step, not the line.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep the session alive (minutes, max 330)'
        required: false
        default: '45'
  push:
    branches: [remote]

concurrency:
  # One live session at a time: a second tunnel would just confuse the owner,
  # and pushing again is also how a stuck session gets replaced.
  group: ios-interactive
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  session:
    runs-on: macos-26
    # GitHub caps a job at 360 minutes. Leave room for the build before the
    # session even starts, and for the final publish steps.
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the simulator app
        id: buildsim
        uses: ./.github/actions/build-simulator

      # Every simctl call below redirects its output. A child that inherits the
      # step's stdout pipe can keep the pipe open after the script ends, and the
      # runner then reports the step as running until the job times out.
      - name: Boot the simulator
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
        run: |
          set -euxo pipefail
          test -n "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light > /dev/null 2>&1 || true
          echo "booted $UDID"

      - name: Install the app
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
          APP: ${{ steps.buildsim.outputs.app_path }}
        run: |
          set -euxo pipefail
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          echo "installed"

      - name: First launch creates the database
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
          BUNDLE: ${{ steps.buildsim.outputs.bundle_id }}
        run: |
          set -euo pipefail
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          DB="$CONTAINER/Library/MinisChat/minis.db"
          echo "container=$CONTAINER"
          mkdir -p "$CONTAINER/Library/MinisChat"
          xcrun simctl launch "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
          for i in $(seq 1 60); do
            if [ -f "$DB" ]; then echo "database appeared after ${i}s"; break; fi
            sleep 1
          done
          sleep 4
          xcrun simctl terminate "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
          sleep 2
          if [ -f "$DB" ]; then ls -la "$DB"; else echo "no database yet; the seed step will skip"; fi

      - name: Seed the review sessions
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
          BUNDLE: ${{ steps.buildsim.outputs.bundle_id }}
        run: |
          set -euo pipefail
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          DB="$CONTAINER/Library/MinisChat/minis.db"
          if [ ! -f "$DB" ]; then
            echo "no database; starting with an empty library"
            exit 0
          fi
          sqlite3 "$DB" < .github/ci/seed-review-session.sql
          sqlite3 "$DB" "PRAGMA wal_checkpoint(TRUNCATE);" > /dev/null || true
          echo "sessions in the library:"
          sqlite3 "$DB" "select id, title from sessions;"
          echo "messages in the review session:"
          sqlite3 "$DB" "select count(*) from messages where session_id='seed-review-session';"

      - name: Start the app with debug auth off
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
          BUNDLE: ${{ steps.buildsim.outputs.bundle_id }}
        run: |
          set -euo pipefail
          # Launch arguments land in NSArgumentDomain, which wins over the
          # stored preference, so this single argument is enough to let the
          # public RPC answer; the `defaults` write below makes it stick even
          # for launches that do not pass the argument.
          xcrun simctl launch "$UDID" "$BUNDLE" -debug.auth.required NO > /dev/null 2>&1 || true
          sleep 5
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE" debug.auth.required -bool NO \
            > /dev/null 2>&1 || echo "defaults write failed; the launch argument still applies"
          sleep 4
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/00-started.png" > /dev/null 2>&1 || true
          # Prove the debug server actually answers before opening a tunnel.
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:8321/schema || true)
          echo "debug server /schema -> $code"
          curl -s -m 10 http://127.0.0.1:8321/schema || true
          test "$code" = "200"

      - name: Open the review session
        run: |
          set -euo pipefail
          rpc() { curl -s -m 20 -X POST http://127.0.0.1:8321/rpc \
            -H 'Content-Type: application/json' -d "$1" || true; }
          rpc '{"jsonrpc":"2.0","id":1,"method":"debug.openSession","params":{"sessionId":"seed-review-session"}}'
          echo
          sleep 3

      - name: Start the console proxy
        run: |
          set -euo pipefail
          nohup python3 .github/ci/remote/serve.py > "$RUNNER_TEMP/serve.log" 2>&1 &
          echo "serve pid $!"
          for i in $(seq 1 40); do
            if curl -fsS -m 5 http://127.0.0.1:8322/schema > /dev/null 2>&1; then
              echo "console proxy answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "console proxy never came up; serve.log:"
          cat "$RUNNER_TEMP/serve.log" || true
          exit 1

      - name: Open the tunnel
        id: tunnel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tunnel"
          curl -fsSL -o "$RUNNER_TEMP/tunnel/cloudflared.tgz" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf "$RUNNER_TEMP/tunnel/cloudflared.tgz" -C "$RUNNER_TEMP/tunnel"
          chmod +x "$RUNNER_TEMP/tunnel/cloudflared"

          nohup "$RUNNER_TEMP/tunnel/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:8322 > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo "cloudflared pid $!"

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "no trycloudflare URL appeared:"
            cat "$RUNNER_TEMP/cloudflared.log" || true
            exit 1
          fi
          echo "tunnel: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$URL/schema" || true)
            echo "probe $URL/schema -> $CODE"
            [ "$CODE" = "200" ] && break
            sleep 3
          done

      - name: Publish the URL
        env:
          URL: ${{ steps.tunnel.outputs.url }}
          UDID: ${{ steps.buildsim.outputs.udid }}
          BUNDLE: ${{ steps.buildsim.outputs.bundle_id }}
          DURATION: ${{ inputs.duration_minutes || '45' }}
        run: |
          set -euo pipefail
          git config user.name "minis-ci"
          git config user.email "minis-ci@users.noreply.github.com"
          git fetch --depth 1 origin main
          git checkout -B remote-url origin/main
          mkdir -p .remote
          {
            echo "url=$URL"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "duration_minutes=$DURATION"
            echo "device=$UDID"
            echo "bundle=$BUNDLE"
          } > .remote/url.txt
          cat .remote/url.txt
          git add -f .remote/url.txt
          git commit -m "remote: session for run ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/remote-url

      - name: Keep the session alive
        env:
          DURATION: ${{ inputs.duration_minutes || '45' }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -uo pipefail
          LIMIT=$(( DURATION * 60 ))
          echo "keeping the session for ${DURATION}m (${LIMIT}s) at $URL"
          START=$SECONDS
          while [ $(( SECONDS - START )) -lt "$LIMIT" ]; do
            sleep 30
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:8322/schema || true)
            echo "t=$(( SECONDS - START ))s console=$CODE"
          done
          echo "session window closed"

      - name: Final capture and logs
        if: always()
        env:
          UDID: ${{ steps.buildsim.outputs.udid }}
        run: |
          set -uo pipefail
          mkdir -p review-assets
          xcrun simctl io "$UDID" screenshot review-assets/98-final.png > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP"/*.log review-assets/ 2>/dev/null || true
          cp "$RUNNER_TEMP/00-started.png" review-assets/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 40m --predicate "process == 'Minis'" \
            > review-assets/session-app.log 2>&1 || true
          ls -la review-assets || true

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minis-interactive-logs
          path: review-assets
          retention-days: 7
          if-no-files-found: warn

      - name: Publish failure logs
        if: failure()
        run: |
          set -uo pipefail
          git config user.name "minis-ci"
          git config user.email "minis-ci@users.noreply.github.com"
          git fetch --depth 1 origin main
          git checkout -B ci-logs origin/main
          mkdir -p .ci-logs
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "job_status=failure"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .ci-logs/interactive-meta.txt
          cp "$RUNNER_TEMP"/*.log .ci-logs/ 2>/dev/null || true
          cp review-assets/*.png .ci-logs/ 2>/dev/null || true
          ls -la .ci-logs || true
          git add -f .ci-logs
          git commit -m "logs: interactive run ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/ci-logs
